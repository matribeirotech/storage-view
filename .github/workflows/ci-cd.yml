name: CI/CD — Storage View

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: pytest

      - name: Smoke test CLI & JSON/CSV outputs
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          storage-view --version
          storage-view src --top 10 --quiet
          storage-view src --json --quiet | python -c "import sys, json; data = json.load(sys.stdin); assert data['stats']['total_files'] > 0"
          storage-view src --csv --quiet | python -c "import sys, csv; rows = list(csv.reader(sys.stdin)); assert rows[0][0] == 'type' and len(rows) > 1"

  build-package:
    name: Build Python Package (wheel + sdist)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  build-windows-exe:
    name: Build Windows Standalone Executables
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build GUI executable (windowed)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name storage-view-gui-windows-x64 `
            --paths src `
            --collect-submodules storage_view `
            --hidden-import storage_view.gui.app `
            --hidden-import storage_view.gui.widgets `
            --collect-data textual `
            --collect-data rich `
            src/storage_view/main.py

      - name: Build CLI/TUI executable (console)
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name storage-view-cli-windows-x64 `
            --paths src `
            --collect-submodules storage_view `
            --hidden-import storage_view.cli.tui_app `
            --hidden-import storage_view.cli.reporter `
            --collect-data textual `
            --collect-data rich `
            src/storage_view/main.py

      - name: Verify CLI executable smoke test
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          .\dist\storage-view-cli-windows-x64.exe --version
          .\dist\storage-view-cli-windows-x64.exe src --top 5 --quiet

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: dist/*.exe

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-package, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Python dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets/

      - name: Download Windows executables
        uses: actions/download-artifact@v4
        with:
          name: windows-executables
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
