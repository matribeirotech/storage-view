[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "storage-view"
version = "0.1.0"
description = "High-performance open-source disk space analyzer with Windows GUI and Linux CLI/TUI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Storage View Contributors" },
]
keywords = ["disk", "storage", "analyzer", "treemap", "ncdu", "cli", "tui", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "send2trash>=1.8.3",
    "PySide6>=6.7.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7.0"]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
storage-view = "storage_view.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/storage_view"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
